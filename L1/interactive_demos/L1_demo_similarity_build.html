<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MRC L1 — From Vectors to the Similarity Matrix</title>
<script>
  MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }, svg: { fontCache: 'global' } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
<link rel="stylesheet" href="../../mrc_styles.css">
<style>
  body { padding-bottom: 120px; }
  .stage-area {
    min-height: 340px;
    display: flex; align-items: center; justify-content: center;
    gap: 30px; flex-wrap: wrap;
    margin: 18px 0;
  }
  .block { text-align: center; }
  .block-title {
    font-family: var(--font-sans); font-size: 12px; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--text-muted); font-weight: 500; margin-bottom: 12px;
  }
  .block-title .accent { color: var(--accent); }

  .mat { display: inline-grid; gap: 5px; font-family: var(--font-serif); }
  .clab, .rlab { font-size: 13px; color: var(--text-muted); display:flex; align-items:center; justify-content:center; }
  .clab.mol, .rlab.mol { color: var(--accent); font-weight: 700; font-size: 14px; }
  .corner { }
  .cell {
    width: 52px; height: 40px; border:1.5px solid var(--rule); border-radius:4px;
    display:flex; align-items:center; justify-content:center; font-size:18px;
    font-variant-numeric: tabular-nums; color: var(--text); transition: background 0.2s;
  }
  .cell.hl { background: #f1ebf8; }
  .cell.hlstrong { background: var(--accent); color:#fff; font-weight:700; }

  .op { font-family: var(--font-serif); font-size: 30px; color: var(--text-muted); align-self: center; }
  .tarrow { display:flex; flex-direction:column; align-items:center; color: var(--text-muted); align-self:center; }
  .tarrow .sym { font-size: 26px; }
  .tarrow .lbl { font-family: var(--font-sans); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }

  /* worked-arithmetic line for the highlighted cell (step 4) */
  .calc { width: 100%; text-align: center; margin-top: 10px; font-family: var(--font-serif); }
  .calc-line { font-size: 19px; color: var(--text); line-height: 1.95; font-variant-numeric: tabular-nums; }
  .calc-line em { font-style: italic; color: var(--accent); font-weight: 700; }
  .calc-line .mut { color: var(--text-muted); font-size: 13px; font-style: italic; }
  .calc-line .res { color: var(--accent); font-weight: 700; font-size: 25px; }

  /* control bar */
  .control-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: white;
    border-top: 1px solid var(--rule); padding: 16px 32px; z-index: 100;
  }
  .control-bar .inner { max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: 24px; }
  .step-caption { flex: 1; font-size: 15px; color: var(--text); line-height: 1.5; }
  .step-caption strong { color: var(--accent); }
  .step-counter { font-family: var(--font-sans); font-size: 11px; letter-spacing: 1.2px; color: var(--text-muted); white-space: nowrap; }
  .btns { display: flex; gap: 8px; }
  .btns button {
    font-family: var(--font-sans); padding: 8px 16px; border: 1px solid var(--rule);
    background: white; color: var(--text); border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  .btns button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btns button:disabled { color: var(--rule); border-color: var(--rule); cursor: not-allowed; }
  .btns .primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btns .primary:hover:not(:disabled) { background: #4d2f87; color: white; }
</style>
</head>
<body>

<div class="stage wide">
  <h1>From Vectors to the Similarity Matrix</h1>
  <div class="subtitle">MRC LECTURE 1 · INTERACTIVE · BUILDING $S = QK^\top$ ONE STEP AT A TIME</div>

  <div class="stage-area" id="area"></div>
</div>

<div class="control-bar">
  <div class="inner">
    <div class="step-caption" id="caption"></div>
    <div class="step-counter" id="counter"></div>
    <div class="btns">
      <button id="prevBtn">← Back</button>
      <button id="nextBtn" class="primary">Next →</button>
      <button id="resetBtn">Reset</button>
    </div>
  </div>
</div>

<script>
  const FEAT = ['elec', 'shape', 'hyd', 'Hbond'];
  const AB = ['Ab₁','Ab₂','Ab₃'], AG = ['Ag₁','Ag₂','Ag₃'];
  const Q = [[2,1,3,0],[1,0,2,2],[0,3,1,1]];   // antibodies × features
  const K = [[2,0,1,1],[1,2,0,1],[0,1,3,0]];   // antigens × features
  const d = FEAT.length;
  function dot(a,b){ let s=0; for(let i=0;i<a.length;i++) s+=a[i]*b[i]; return s; }
  const S = Q.map(qi => K.map(kj => dot(qi,kj)));   // antibodies × antigens
  const Kt = FEAT.map((_,f) => K.map(row => row[f])); // features × antigens

  // render a matrix grid. opts: {hlRows:[], hlCols:[], hlCell:[i,j]}
  function mat(data, rLabels, cLabels, opts={}) {
    const nr = data.length, nc = data[0].length;
    const hlRows = opts.hlRows||[], hlCols = opts.hlCols||[], hc = opts.hlCell;
    const rMol = opts.rMol, cMol = opts.cMol;
    let h = `<div class="mat" style="grid-template-columns:${cLabels?'auto ':''}repeat(${nc},52px);">`;
    if (cLabels) {
      h += `<div class="corner"></div>`;
      cLabels.forEach((c,j) => h += `<div class="clab ${cMol?'mol':''}">${c}</div>`);
    }
    for (let i=0;i<nr;i++){
      if (rLabels) h += `<div class="rlab ${rMol?'mol':''}">${rLabels[i]}</div>`;
      for (let j=0;j<nc;j++){
        let cls='cell';
        if (hc && hc[0]===i && hc[1]===j) cls+=' hlstrong';
        else if (hlRows.includes(i) || hlCols.includes(j)) cls+=' hl';
        h += `<div class="${cls}">${data[i][j]}</div>`;
      }
    }
    h += `</div>`;
    return h;
  }
  function block(title, inner){ return `<div class="block"><div class="block-title">${title}</div>${inner}</div>`; }

  const STEPS = [
    {
      caption: `Start with your antibodies. Each one is described by a list of numbers — its <strong>feature vector</strong> (its "embedding"). Stack them as rows into a table called <strong>Q</strong>.`,
      render: () => block(`<span class="accent">Q</span> — antibodies as rows`, mat(Q, AB, FEAT, {rMol:true}))
    },
    {
      caption: `Do the same for antigens: each is a vector too, stacked as rows into table <strong>K</strong>. Right now <em>both</em> tables have molecules as rows.`,
      render: () => block(`<span class="accent">Q</span> — antibodies`, mat(Q, AB, FEAT, {rMol:true}))
                  + `<div class="op">&nbsp;</div>`
                  + block(`<span class="accent">K</span> — antigens as rows`, mat(K, AG, FEAT, {rMol:true}))
    },
    {
      caption: `Here's the subtlety — and why this looks different from the single dot products we just did. To do <em>all</em> the pairs at once, matrix multiplication follows one rule: it pairs a <strong>row</strong> of the left matrix with a <strong>column</strong> of the right. But our antigen vectors are <em>rows</em>. So we tip K onto its side — the <strong>transpose</strong> $K^\\top$ — making each antigen a <strong>column</strong>. The numbers never change; they are just turned so "row × column" becomes exactly the antibody · antigen dot product.`,
      render: () => block(`<span class="accent">K</span> — antigens as rows`, mat(K, AG, FEAT, {rMol:true}))
                  + `<div class="tarrow"><div class="sym">⇄</div><div class="lbl">transpose</div></div>`
                  + block(`<span class="accent">Kᵀ</span> — antigens as columns`, mat(Kt, FEAT, AG, {cMol:true}))
    },
    {
      caption: `Now line them up: Q's rows (antibodies) against Kᵀ's columns (antigens). Each cell of <strong>S</strong> is just a <strong>dot product</strong> — the very same operation you did for a single pair — one antibody-row · one antigen-column. Here is exactly how the outlined cell becomes <strong>10</strong>:`,
      render: () => {
        const i = 0, j = 2, ab = Q[i], ag = K[j];
        const terms = ab.map((v,k) => `(${v})(${ag[k]})`).join(' + ');
        const prods = ab.map((v,k) => v*ag[k]).join(' + ');
        const calc = `<div class="calc">
            <div class="calc-line"><span class="mut">row of Q →</span> <em>Ab₁</em> = [${ab.join(', ')}] &nbsp;&nbsp;&nbsp; <span class="mut">column of Kᵀ →</span> <em>Ag₃</em> = [${ag.join(', ')}]</div>
            <div class="calc-line"><em>Ab₁ · Ag₃</em> &nbsp;=&nbsp; ${terms} &nbsp;=&nbsp; ${prods} &nbsp;=&nbsp; <span class="res">${S[i][j]}</span></div>
          </div>`;
        return block(`<span class="accent">Q</span>`, mat(Q, AB, FEAT, {rMol:true, hlRows:[0]}))
          + `<div class="op">×</div>`
          + block(`<span class="accent">Kᵀ</span>`, mat(Kt, FEAT, AG, {cMol:true, hlCols:[2]}))
          + `<div class="op">=</div>`
          + block(`<span class="accent">S</span> — similarity matrix`, mat(S, AB, AG, {cMol:true, rMol:true, hlCell:[0,2]}))
          + calc;
      }
    },
  ];

  let step = 0;
  const area = document.getElementById('area');
  const caption = document.getElementById('caption');
  const counter = document.getElementById('counter');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  function show(n) {
    step = Math.max(0, Math.min(STEPS.length-1, n));
    area.innerHTML = STEPS[step].render();
    caption.innerHTML = STEPS[step].caption;
    counter.textContent = `STEP ${step+1} / ${STEPS.length}`;
    prevBtn.disabled = step === 0;
    nextBtn.disabled = step === STEPS.length-1;
    if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([area, caption]);
  }
  function next(){ if (step < STEPS.length-1) show(step+1); else escalate('next'); }
  function prev(){ if (step > 0) show(step-1); else escalate('prev'); }
  function escalate(dir){ if (window.parent && window.parent!==window) window.parent.postMessage({type:'mrc-deck-advance',direction:dir},'*'); }

  nextBtn.addEventListener('click', next);
  prevBtn.addEventListener('click', prev);
  document.getElementById('resetBtn').addEventListener('click', () => show(0));

  document.addEventListener('keydown', (e) => {
    if (['INPUT','TEXTAREA','SELECT','BUTTON'].includes(e.target.tagName)) return;
    if (['ArrowRight',' ','PageDown','ArrowDown'].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft','PageUp','ArrowUp'].includes(e.key)) { e.preventDefault(); prev(); }
  });

  show(0);
</script>

</body>
</html>
