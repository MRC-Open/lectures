<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MRC L2 — Two Routes to the Partner</title>
<script>
  MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }, svg: { fontCache: 'global' } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
<link rel="stylesheet" href="../../mrc_styles.css">
<style>
  .toggles { display: flex; gap: 8px; justify-content: center; margin: 2px 0 10px 0; }
  .tbtn { font-family: var(--font-sans); font-size: 13px; padding: 7px 16px; border: 1px solid var(--rule); background: white; color: var(--text-muted); border-radius: 4px; cursor: pointer; transition: all 0.15s; }
  .tbtn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-faint); font-weight: 600; }

  .recog { text-align: center; font-family: var(--font-sans); font-size: 13px; line-height: 1.6; margin: 2px auto 12px; max-width: 720px; color: var(--text); background: var(--accent-faint); border-radius: 6px; padding: 8px 14px; }
  .recog .seek { color: var(--accent); font-weight: 700; }
  .recog .part { font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }

  .plot-wrap { background: white; }
  svg.viz { display: block; width: 100%; height: auto; }
  .routelab { font-family: var(--font-sans); font-size: 12px; font-weight: 700; }
  .routesub { font-family: var(--font-sans); font-size: 10px; }
  .chip { fill: white; stroke: var(--rule); stroke-width: 1.5; }
  .chip.partner { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; }
  .chip.seeker { stroke: var(--accent); stroke-width: 2.5; }
  .chiptext { font-family: var(--font-serif); font-size: 15px; fill: var(--text); }
  .tag { font-family: var(--font-sans); font-size: 9px; letter-spacing: 0.4px; text-transform: uppercase; fill: var(--accent); font-weight: 600; }
  .attnarc { fill: none; stroke: var(--accent); stroke-width: 2.8; }
  .chain { stroke: #c98b86; stroke-width: 1.8; fill: none; }
  .hoplab { font-family: var(--font-sans); font-size: 9px; fill: #b4453a; }
  .pulse { fill: var(--accent); }

  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 720px; margin: 16px auto 0; }
  .cc { border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; text-align: center; }
  .cc.attn { border-color: var(--accent); }
  .cc .ccl { font-family: var(--font-sans); font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600; margin-bottom: 5px; }
  .cc.rnn .ccl { color: #b4453a; }
  .cc.attn .ccl { color: var(--accent); }
  .cc .ccv { font-family: var(--font-serif); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cc.rnn .ccv { color: #b4453a; }
  .cc.attn .ccv { color: var(--accent); }
  .cc .ccmath { font-family: var(--font-serif); font-size: 12px; color: var(--text-muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .cc .ccd { font-size: 12px; color: var(--text-muted); font-style: italic; margin-top: 4px; }

  .scaling { border: 1px solid var(--rule); border-radius: 6px; padding: 14px 18px; max-width: 720px; margin: 16px auto 0; }
  .scaling .shead { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .scaling .shead label { font-family: var(--font-serif); font-style: italic; font-size: 15px; min-width: 230px; }
  .scaling .shead input { flex: 1; accent-color: var(--accent); }
  .scaling .shead .v { font-family: var(--font-serif); font-weight: 700; color: var(--accent); min-width: 40px; text-align: right; }
  .bar-row { display: grid; grid-template-columns: 80px 1fr 96px; gap: 10px; align-items: center; padding: 5px 0; font-size: 13px; }
  .bar-row .bl { font-family: var(--font-sans); color: var(--text-muted); }
  .bar-track { height: 18px; background: var(--rail); border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 100%; transition: width 0.2s; }
  .bar-fill.rnn { background: #b4453a; }
  .bar-fill.attn { background: var(--accent); }
  .bar-row .bv { font-family: var(--font-serif); font-variant-numeric: tabular-nums; text-align: right; }

  .bridge { border-top: 1px solid var(--rule); padding-top: 16px; margin-top: 20px; font-size: 15px; line-height: 1.7; color: var(--text); text-align: center; }
  .bridge strong { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>

<div class="stage wide">

  <h1>Two Routes to the Partner</h1>
  <div class="subtitle">MRC LECTURE 2 · INTUITION · THE SAME RECOGNITION, REACHED TWO WAYS</div>

  <div class="toggles">
    <button class="tbtn on" data-ex="protein">Protein · PLM</button>
    <button class="tbtn" data-ex="sentence">Sentence · LLM</button>
  </div>

  <div class="recog" id="recog"></div>

  <div class="plot-wrap"><svg class="viz" id="viz" viewBox="0 0 820 270"></svg></div>

  <div class="compare">
    <div class="cc rnn">
      <div class="ccl">RNN — relay down the chain</div>
      <div class="ccv" id="rnnv">—</div>
      <div class="ccmath" id="rnnmath"></div>
      <div class="ccd">loses 40% at every hop</div>
    </div>
    <div class="cc attn">
      <div class="ccl">Attention — read it directly</div>
      <div class="ccv">100%</div>
      <div class="ccmath">one step · any distance</div>
      <div class="ccd">distance never enters the computation</div>
    </div>
  </div>

  <div class="scaling">
    <div class="shead">
      <label>how much of the partner reaches the seeker as the gap grows…</label>
      <input type="range" id="dist" min="2" max="50" step="1" value="9">
      <div class="v" id="distVal">9</div>
    </div>
    <div class="bar-row">
      <div class="bl">RNN</div>
      <div class="bar-track"><div class="bar-fill rnn" id="rnnBar"></div></div>
      <div class="bv" id="rnnBarVal">—</div>
    </div>
    <div class="bar-row">
      <div class="bl">Attention</div>
      <div class="bar-track"><div class="bar-fill attn" style="width:100%"></div></div>
      <div class="bv">100%</div>
    </div>
  </div>

  <div class="bridge" id="bridge"></div>

</div>

<script>
  const LAMBDA = 0.6;
  const EX = {
    protein: {
      tokens:['C','V','Q','L','V','E','S','G','G','C'],
      partner:0, seeker:9,
      partnerLabel:'Cys @ pos 1', seekerLabel:'Cys @ pos 10',
      task:'The two <span class="part">cysteines</span> must pair into a disulfide bond — so position 10 must <span class="seek">recognize</span> position 1.'
    },
    sentence: {
      tokens:['The','antibody','that','the','lab','made','binds'],
      partner:1, seeker:6,
      partnerLabel:'"antibody" (subject)', seekerLabel:'"binds" (verb)',
      task:'The verb <span class="seek">"binds"</span> must agree with its subject <span class="part">"antibody"</span> — five positions back.'
    }
  };
  let exKey='protein', dist=9, pulseT=0, raf=null;

  const viz=document.getElementById('viz');
  const W=820, MARG=46, ROWY=150, CW_MAX=56;

  function geom(n){ const span=W-2*MARG, step=span/Math.max(1,n-1); return i=>MARG+i*step; }

  function draw(){
    const ex=EX[exKey], n=ex.tokens.length, cx=geom(n);
    const cw=Math.min(CW_MAX,(W-2*MARG)/n-8), ct=ROWY-22, cb=ROWY+22;
    let h='';

    // route labels
    h+=`<text class="routelab" x="${MARG-8}" y="58" text-anchor="start" fill="var(--accent)">ATTENTION</text>`;
    h+=`<text class="routesub" x="${MARG-8}" y="72" text-anchor="start" fill="var(--text-muted)">one direct comparison</text>`;
    h+=`<text class="routelab" x="${MARG-8}" y="244" text-anchor="start" fill="#b4453a">RNN</text>`;
    h+=`<text class="routesub" x="${MARG-8}" y="258" text-anchor="start" fill="var(--text-muted)">relay, hop by hop</text>`;

    // ATTENTION arc above (seeker -> partner)
    const xs=cx(ex.seeker), xp=cx(ex.partner), midx=(xs+xp)/2;
    h+=`<path class="attnarc" d="M ${xs} ${ct} Q ${midx} 40 ${xp} ${ct}" marker-end="url(#ah)"/>`;
    h+=`<text class="routesub" x="${midx}" y="34" text-anchor="middle" fill="var(--accent)" font-weight="700">direct — distance ignored</text>`;

    // RNN chain below (partner -> ... -> seeker), arrows each hop with x0.6
    const lo=Math.min(ex.partner,ex.seeker), hi=Math.max(ex.partner,ex.seeker);
    for(let i=0;i<n-1;i++){
      const onpath = (i>=lo && i<hi);
      h+=`<line class="chain" x1="${cx(i)+cw/2}" y1="${cb+18}" x2="${cx(i+1)-cw/2}" y2="${cb+18}" opacity="${onpath?1:0.25}" marker-end="url(#ch)"/>`;
      if(onpath) h+=`<text class="hoplab" x="${(cx(i)+cx(i+1))/2}" y="${cb+34}" text-anchor="middle">×0.6</text>`;
    }
    // fading pulse travelling partner->seeker
    {
      const x0=cx(ex.partner), x1=cx(ex.seeker);
      const px=x0+(x1-x0)*pulseT;
      const steps=(hi-lo)*pulseT, op=Math.pow(LAMBDA,steps), r=4+7*op;
      h+=`<circle class="pulse" cx="${px}" cy="${cb+18}" r="${r}" opacity="${(0.2+0.8*op).toFixed(3)}"/>`;
    }

    // chips
    for(let i=0;i<n;i++){
      const pc=i===ex.partner?'partner':(i===ex.seeker?'seeker':'');
      h+=`<rect class="chip ${pc}" x="${cx(i)-cw/2}" y="${ct}" width="${cw}" height="44" rx="7"/>`;
      h+=`<text class="chiptext" x="${cx(i)}" y="${ROWY+5}" text-anchor="middle">${ex.tokens[i]}</text>`;
      if(i===ex.partner) h+=`<text class="tag" x="${cx(i)}" y="${ct-8}" text-anchor="middle">partner</text>`;
      if(i===ex.seeker) h+=`<text class="tag" x="${cx(i)}" y="${ct-8}" text-anchor="middle">seeker</text>`;
    }

    h+=`<defs>
      <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="var(--accent)"/></marker>
      <marker id="ch" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c98b86"/></marker>
    </defs>`;
    viz.innerHTML=h;
  }

  function fmtPct(s){ if(s>=0.001) return (s*100).toFixed(s>=0.1?0:1)+'%'; return (s*100).toExponential(1)+'%'; }

  function update(){
    const ex=EX[exKey];
    document.getElementById('recog').innerHTML=`<b>Recognition task.</b> ${ex.task}`;
    const gap=Math.abs(ex.seeker-ex.partner);
    const sig=Math.pow(LAMBDA,gap);
    document.getElementById('rnnv').textContent=fmtPct(sig);
    document.getElementById('rnnmath').innerHTML=`0.6<sup>${gap}</sup> = 0.6×0.6×…(${gap}×) = ${sig.toFixed(3)}`;
    document.getElementById('bridge').innerHTML=
      `The RNN's only route to ${ex.partnerLabel} is a <span style="color:#b4453a;font-weight:700;">relay down the chain</span> — 40% lost at every hop, so across a gap of ${gap} only <strong>${fmtPct(sig)}</strong> arrives (and every step must wait for the one before it). <strong>Attention deletes the chain:</strong> ${ex.seekerLabel} reads the partner <strong>directly — full strength, at any distance, all pairs at once.</strong> That is the reference-frame fix from the last two slides, and the reason transformers replaced recurrence. The next slides show <em>how</em> the direct comparison is computed.`;
    if(window.MathJax&&window.MathJax.typesetPromise) window.MathJax.typesetPromise([document.getElementById('bridge')]);
    draw();
  }

  function updateScaling(){
    dist=parseInt(document.getElementById('dist').value);
    document.getElementById('distVal').textContent=dist;
    const sig=Math.pow(LAMBDA,dist);
    const fill=Math.max(0,(11+Math.log10(sig))/11);
    document.getElementById('rnnBar').style.width=(fill*100).toFixed(1)+'%';
    document.getElementById('rnnBarVal').innerHTML=fmtPct(sig);
  }

  function startPulse(){ stopPulse(); let last=null; const tick=ts=>{ if(last===null)last=ts; pulseT+=(ts-last)/2600; last=ts; if(pulseT>=1)pulseT=0; draw(); raf=requestAnimationFrame(tick); }; raf=requestAnimationFrame(tick); }
  function stopPulse(){ if(raf){cancelAnimationFrame(raf);raf=null;} }

  document.querySelectorAll('[data-ex]').forEach(b=>b.addEventListener('click',()=>{
    exKey=b.dataset.ex; pulseT=0;
    document.querySelectorAll('[data-ex]').forEach(x=>x.classList.toggle('on',x.dataset.ex===exKey));
    update();
  }));
  document.getElementById('dist').addEventListener('input',updateScaling);

  update(); updateScaling(); startPulse();

  if (window.parent && window.parent !== window) {
    document.addEventListener('keydown', (e) => {
      if (['INPUT','TEXTAREA','SELECT','BUTTON'].includes(e.target.tagName)) return;
      const nx=['ArrowRight','PageDown'], pv=['ArrowLeft','PageUp'];
      if (nx.includes(e.key)){ e.preventDefault(); window.parent.postMessage({type:'mrc-deck-advance',direction:'next'},'*'); }
      else if (pv.includes(e.key)){ e.preventDefault(); window.parent.postMessage({type:'mrc-deck-advance',direction:'prev'},'*'); }
    });
  }
</script>

</body>
</html>
