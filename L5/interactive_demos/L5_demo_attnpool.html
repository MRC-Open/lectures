<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MRC L5 — Attention Pooling</title>
<link rel="stylesheet" href="../../mrc_styles.css">
<style>
  .stage.wide { padding-top: 14px; }
  .subtitle { text-transform: uppercase; letter-spacing: 1.3px; }

  .tabs { display: flex; gap: 8px; justify-content: center; margin: 10px auto 0; }
  .tab { font-family: var(--font-sans); font-size: 13px; font-weight: 600; padding: 6px 16px; border: 1px solid var(--rule); border-radius: 6px; background: white; cursor: pointer; color: var(--text); transition: all .12s; }
  .tab:hover { border-color: var(--accent); }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .grid { max-width: 760px; margin: 14px auto 0; }
  .colhead { display: grid; grid-template-columns: 26px 210px 1fr; gap: 12px; align-items: end; font-family: var(--font-sans); font-size: 10px; letter-spacing: 0.4px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 5px; }
  .colhead .c2 { text-align: center; }
  .rrow { display: grid; grid-template-columns: 26px 210px 1fr; gap: 12px; align-items: center; margin: 3px 0; }
  .rl { font-family: var(--font-sans); font-weight: 700; font-size: 14px; color: var(--text-muted); text-align: right; }
  .cells { display: flex; gap: 2px; }
  .cell { width: 33px; height: 23px; display: flex; align-items: center; justify-content: center; font-family: var(--font-serif); font-size: 11.5px; font-variant-numeric: tabular-nums; border-radius: 2px; transition: opacity .5s; }
  .wt { display: flex; align-items: center; gap: 8px; }
  .bartrack { flex: 1; height: 16px; background: #f0eef6; border-radius: 3px; overflow: hidden; max-width: 240px; }
  .bar { height: 100%; background: var(--accent); border-radius: 3px; width: 0%; transition: width .6s cubic-bezier(.4,0,.2,1); }
  .aval { font-family: var(--font-serif); font-weight: 700; font-size: 13px; color: var(--accent); min-width: 40px; font-variant-numeric: tabular-nums; }

  .sumrow { display: grid; grid-template-columns: 26px 210px 1fr; gap: 12px; align-items: center; margin-top: 10px; border-top: 1px solid var(--rule); padding-top: 8px; }
  .sumrow .lbl { font-family: var(--font-serif); font-weight: 700; font-size: 17px; color: #2b6cb0; text-align: right; }
  .qcells { display: flex; gap: 2px; }
  .qcell { width: 33px; height: 25px; display: flex; align-items: center; justify-content: center; font-family: var(--font-serif); font-size: 11.5px; font-variant-numeric: tabular-nums; border-radius: 2px; outline: 2px solid #2b6cb0; outline-offset: -2px; transition: background .4s; }
  .qform { font-family: var(--font-sans); font-size: 11px; color: var(--text-muted); }

  .note { max-width: 820px; margin: 14px auto 0; text-align: center; font-family: var(--font-serif); font-size: 14.5px; line-height: 1.5; color: var(--text); }
  .note b { color: var(--accent); }
  .replay { font-family: var(--font-sans); font-size: 12px; color: var(--accent); background: none; border: 1px solid var(--accent); border-radius: 5px; padding: 4px 12px; cursor: pointer; margin-left: 10px; }
</style>
</head>
<body>

<div class="stage wide">
  <h1>Attention Pooling — Weighting the Residues That Matter</h1>
  <div class="subtitle">The pool itself is an attention step — Session 2, one more time</div>

  <div class="tabs">
    <button class="tab" id="tabMean" data-mode="mean">mean-pool (equal)</button>
    <button class="tab active" id="tabAttn" data-mode="attn">attention-pool (learned)</button>
    <button class="replay" id="replay">↻ replay</button>
  </div>

  <div class="grid">
    <div class="colhead"><div></div><div class="c2">embedding matrix — residues × features</div><div>attention weight &alpha;<sub>i</sub> &nbsp;(how much this residue counts)</div></div>
    <div id="rows"></div>
    <div class="sumrow">
      <div class="lbl">q</div>
      <div><div class="qcells" id="qcells"></div></div>
      <div class="qform">q = &Sigma;<sub>i</sub> &alpha;<sub>i</sub> &middot; row<sub>i</sub> &nbsp; — the pooled vector</div>
    </div>
  </div>

  <div class="note" id="note"></div>
</div>

<script>
  function heat(t){ t=Math.max(0,Math.min(1,t)); let r,g,b;
    if(t<0.5){const u=t/0.5; r=43+(238-43)*u; g=108+(238-108)*u; b=176+(238-176)*u;}
    else{const u=(t-0.5)/0.5; r=238+(200-238)*u; g=238+(54-238)*u; b=238+(54-238)*u;}
    return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`; }
  const VMIN=-1.5, VMAX=2.0, col=v=>heat((v-VMIN)/(VMAX-VMIN));
  const fnum=x=>x.toFixed(1).replace('-','−');
  const D=6;
  const RES=['C','A','R','D','Y','W'];
  const M=[
    [1.2,-0.4,0.8,1.5,-0.2,0.6],
    [0.9,-0.1,1.1,0.7,0.3,0.4],
    [1.6,-0.6,0.5,1.2,-0.5,0.9],
    [0.7,0.2,0.9,1.0,0.1,0.3],
    [1.1,-0.3,0.7,1.3,-0.1,0.7],
    [1.4,-0.5,0.6,1.6,-0.3,0.8]];
  const N=RES.length;
  const A_MEAN=Array(N).fill(1/N);
  const A_ATTN=[0.04,0.07,0.13,0.31,0.27,0.18];   // interface residues (D,Y,W) dominate
  let mode='attn';

  function pooled(alpha){ const q=Array(D).fill(0);
    for(let i=0;i<N;i++) for(let j=0;j<D;j++) q[j]+=alpha[i]*M[i][j];
    return q.map(x=>+x.toFixed(1)); }

  // build static rows once
  function buildRows(){
    let h='';
    for(let i=0;i<N;i++){
      let cells='';
      for(let j=0;j<D;j++){ const v=M[i][j]; cells+=`<div class="cell" id="c${i}_${j}" style="background:${col(v)}">${fnum(v)}</div>`; }
      h+=`<div class="rrow"><div class="rl">${RES[i]}</div><div class="cells">${cells}</div>`+
         `<div class="wt"><div class="bartrack"><div class="bar" id="bar${i}"></div></div><div class="aval" id="av${i}"></div></div></div>`;
    }
    document.getElementById('rows').innerHTML=h;
    let q='';
    for(let j=0;j<D;j++) q+=`<div class="qcell" id="q${j}"></div>`;
    document.getElementById('qcells').innerHTML=q;
  }

  function apply(animate){
    const alpha = mode==='mean'?A_MEAN:A_ATTN;
    const maxA=Math.max(...alpha);
    for(let i=0;i<N;i++){
      const set=()=>{ document.getElementById('bar'+i).style.width=(alpha[i]/maxA*100).toFixed(0)+'%';
        document.getElementById('av'+i).textContent=alpha[i].toFixed(2);
        // de-emphasize low-weight residues' cells
        const op = mode==='mean'?1:(0.35+0.65*alpha[i]/maxA);
        for(let j=0;j<D;j++) document.getElementById('c'+i+'_'+j).style.opacity=op;
      };
      if(animate){ document.getElementById('bar'+i).style.width='0%'; setTimeout(set, 80+i*60); }
      else set();
    }
    const q=pooled(alpha);
    setTimeout(()=>{ for(let j=0;j<D;j++){ const el=document.getElementById('q'+j); el.textContent=fnum(q[j]); el.style.background=col(q[j]); } },
      animate?500:0);
    // note + tabs
    document.getElementById('tabMean').classList.toggle('active', mode==='mean');
    document.getElementById('tabAttn').classList.toggle('active', mode==='attn');
    document.getElementById('note').innerHTML = mode==='mean'
      ? 'Mean-pool gives every residue the <b>same</b> weight (1/6). Framework residues that never touch the antigen <b>dilute</b> the binding signal.'
      : 'Attention-pool <b>learns</b> α: a query scores each residue, softmax → weights. The <b>interface residues (D, Y, W)</b> dominate; framework residues fade. <b>Same attention you learned in Session 2 — now used to pool.</b>';
  }

  buildRows();
  document.getElementById('tabMean').onclick=()=>{ mode='mean'; apply(true); };
  document.getElementById('tabAttn').onclick=()=>{ mode='attn'; apply(true); };
  document.getElementById('replay').onclick=()=>apply(true);
  apply(true);

  if (window.parent && window.parent !== window) {
    document.addEventListener('keydown', (e) => {
      if (['INPUT','TEXTAREA','SELECT','BUTTON'].includes(e.target.tagName)) return;
      const nx=['ArrowRight','PageDown',' ','ArrowDown'], pv=['ArrowLeft','PageUp','ArrowUp'];
      if (nx.includes(e.key)){ e.preventDefault(); window.parent.postMessage({type:'mrc-deck-advance',direction:'next'},'*'); }
      else if (pv.includes(e.key)){ e.preventDefault(); window.parent.postMessage({type:'mrc-deck-advance',direction:'prev'},'*'); }
    });
  }
</script>

</body>
</html>
