<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MRC L3 — InfoNCE, From Cosines</title>
<script>
  MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }, svg: { fontCache: 'global' } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
<link rel="stylesheet" href="../../mrc_styles.css">
<style>
  .recog { text-align: center; font-family: var(--font-sans); font-size: 13px; line-height: 1.6; margin: 2px auto 10px; max-width: 820px; color: var(--text); background: var(--accent-faint); border-radius: 6px; padding: 8px 14px; }
  .recog b { color: var(--accent); }
  .toggles { display: flex; gap: 8px; justify-content: center; margin: 2px 0 10px 0; }
  .tbtn { font-family: var(--font-sans); font-size: 13px; padding: 7px 16px; border: 1px solid var(--rule); background: white; color: var(--text-muted); border-radius: 4px; cursor: pointer; }
  .tbtn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-faint); font-weight: 600; }

  .cols { display:flex; gap:26px; justify-content:center; align-items:flex-start; flex-wrap:wrap; }
  .grid { display:inline-grid; gap:3px; }
  .ml { font-family: var(--font-serif); font-size:12px; color: var(--text-muted); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.1; }
  .ml.seq { font-family: var(--font-serif); font-size:11px; color: var(--text); cursor:pointer; padding:0 4px; }
  .ml.seq.anchor { color: var(--accent); font-weight:700; }
  .ml .sub { font-family: var(--font-sans); font-size:8px; color: var(--text-muted); }
  .corner { font-family: var(--font-sans); font-size:9px; color: var(--text-muted); display:flex; align-items:flex-end; justify-content:center; }
  .cell { width:50px; height:38px; border-radius:3px; display:flex; align-items:center; justify-content:center; font-family: var(--font-serif); font-size:13px; font-variant-numeric:tabular-nums; }
  .cell.diag { outline:2px solid var(--accent); outline-offset:-2px; }
  .cell.arow { box-shadow: inset 0 0 0 2px #111; }

  .panel { max-width:360px; }
  .panel .ph { font-family: var(--font-sans); font-size:11px; letter-spacing:0.5px; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:6px; }
  .rowcos { font-family: var(--font-serif); font-size:12px; color: var(--text-muted); margin-bottom:8px; font-variant-numeric:tabular-nums; }
  .pbar { display:grid; grid-template-columns:74px 1fr 46px; gap:8px; align-items:center; padding:2px 0; font-size:12px; }
  .pbar .pt { font-family: var(--font-serif); text-align:right; color: var(--text); }
  .pbar .pt.match { color: var(--accent); font-weight:700; }
  .ptrack { height:18px; background: var(--rail); border-radius:3px; overflow:hidden; }
  .pfill { height:100%; }
  .pbar .pv { font-family: var(--font-serif); font-variant-numeric:tabular-nums; text-align:right; }
  .lossbox { border:1px solid var(--rule); border-radius:8px; padding:9px 14px; margin-top:10px; font-family: var(--font-serif); font-size:13px; text-align:center; line-height:1.7; }
  .lossbox .res { color: var(--accent); font-weight:700; font-size:16px; }

  .ctrl { display:flex; align-items:center; gap:14px; max-width:560px; margin:14px auto 0; padding:10px 16px; border:1px solid var(--rule); border-radius:6px; }
  .ctrl label { font-family: var(--font-serif); font-style:italic; font-size:15px; min-width:190px; }
  .ctrl input { flex:1; accent-color: var(--accent); }
  .ctrl .v { font-family: var(--font-serif); font-weight:700; color:var(--accent); min-width:48px; text-align:right; font-variant-numeric:tabular-nums; }

  .metrics { display:flex; gap:14px; justify-content:center; margin:12px auto 0; }
  .met { border:1px solid var(--rule); border-radius:7px; padding:7px 16px; text-align:center; min-width:110px; }
  .met .ml2 { font-family: var(--font-sans); font-size:10px; text-transform:uppercase; letter-spacing:0.4px; color:var(--text-muted); }
  .met .mv { font-family: var(--font-serif); font-size:22px; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums; }
  .met .mv.good { color:#3a6b3a; }

  .legend { display:flex; align-items:center; justify-content:center; gap:8px; margin: 10px auto 0; font-family: var(--font-sans); font-size:10px; color: var(--text-muted); }
  .legbar { width:140px; height:10px; border-radius:5px; background: linear-gradient(90deg, rgb(43,108,176), rgb(238,238,238), rgb(200,54,54)); }
  .bridge { border-top: 1px solid var(--rule); padding-top: 14px; margin-top: 12px; font-size: 15px; line-height: 1.7; color: var(--text); text-align: center; }
  .bridge strong { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>

<div class="stage wide">
  <h1>InfoNCE — Turning the Matrix Into One Loss</h1>
  <div class="subtitle">MRC LECTURE 3 · INTUITION · SOFTMAX A ROW OF COSINES · −log P(match)</div>

  <div class="recog" id="recog"></div>
  <div class="toggles">
    <button class="tbtn on" data-ex="clip">CLIP · image ↔ text</button>
    <button class="tbtn" data-ex="calm">SFM · antibody ↔ antigen</button>
  </div>

  <div class="cols">
    <div>
      <div class="grid" id="grid"></div>
      <div class="legend"><span>0</span><div class="legbar"></div><span>1</span><span style="margin-left:4px;font-style:italic;">cosine</span></div>
    </div>
    <div class="panel">
      <div class="ph" id="ph"></div>
      <div class="rowcos" id="rowcos"></div>
      <div id="pbars"></div>
      <div class="lossbox" id="lossbox"></div>
    </div>
  </div>

  <div class="ctrl">
    <label>temperature τ</label>
    <input type="range" id="tau" min="0.08" max="1.0" step="0.02" value="0.25">
    <div class="v" id="tauv">0.25</div>
  </div>
  <div class="metrics">
    <div class="met"><div class="ml2">total loss</div><div class="mv" id="lossT"></div></div>
    <div class="met"><div class="ml2">picks correct (R@1)</div><div class="mv" id="r1"></div></div>
    <div class="met"><div class="ml2">avg P(match)</div><div class="mv" id="pAvg"></div></div>
  </div>

  <div class="bridge" id="bridge"></div>
</div>

<script>
  function heat(t){ t=Math.max(0,Math.min(1,t)); let r,g,b;
    if(t<0.5){const u=t/0.5; r=43+(238-43)*u; g=108+(238-108)*u; b=176+(238-176)*u;}
    else{const u=(t-0.5)/0.5; r=238+(200-238)*u; g=238+(54-238)*u; b=238+(54-238)*u;}
    return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`; }
  const f2=n=>n.toFixed(2);
  const dot=(a,b)=>a.reduce((s,_,i)=>s+a[i]*b[i],0);
  const cos=(a,b)=>dot(a,b)/(Math.sqrt(dot(a,a))*Math.sqrt(dot(b,b)));

  const EX = {
    clip: { corner:'img \\ txt', rlw:48, who:'image', tgt:'caption',
      recog:'<b>InfoNCE</b> turns the matching matrix into <b>one number to minimise</b>. For each image, take its row of cosines, scale by temperature <b>τ</b>, and <b>softmax</b> — the matched caption should win. The loss is <b>−log P(match)</b>: small only when the model bets on the right pair. Same <b>softmax = Boltzmann</b>.',
      rows:[{l:'🐕',v:[0.9,0.2,0.1,0.1]},{l:'🐈',v:[0.5,0.8,0.1,0.2]},{l:'🚗',v:[0.1,0.1,0.9,0.2]},{l:'🍕',v:[0.1,0.2,0.2,0.9]}],
      cols:[{l:'dog',v:[0.8,0.3,0.2,0.0]},{l:'cat',v:[0.4,0.7,0.0,0.2]},{l:'car',v:[0.2,0.0,0.8,0.3]},{l:'pizza',v:[0.0,0.3,0.1,0.8]}],
      bridge:'<strong>Minimising InfoNCE = maximising the Boltzmann probability that each image picks its true caption.</strong> Done both ways (rows and columns) it is the <strong>symmetric</strong> loss (next).' },
    calm: { corner:'H3 \\ epi', rlw:78, who:'antibody', tgt:'epitope',
      recog:'<b>InfoNCE</b> on amino-acid sequences. For each antibody CDR-H3, take its row of cosines to the epitopes, scale by <b>τ</b>, and <b>softmax</b> — the true epitope should win. The loss <b>−log P(match)</b> is small only when the model bets on the real binder. The embedding space becomes a <b>binding-energy landscape</b> ($\\cos\\leftrightarrow-\\Delta G$).',
      rows:[{l:'CARDYW',sub:'Ab1',v:[0.9,0.2,0.1,0.1]},{l:'CARGYW',sub:'Ab2',v:[0.5,0.8,0.1,0.2]},{l:'CARHPW',sub:'Ab3',v:[0.1,0.1,0.9,0.2]},{l:'CARWFW',sub:'Ab4',v:[0.1,0.2,0.2,0.9]}],
      cols:[{l:'FNCYF',sub:'RBD',v:[0.8,0.3,0.2,0.0]},{l:'GVTQN',sub:'HA',v:[0.4,0.7,0.0,0.2]},{l:'ALDPS',sub:'PD-1',v:[0.2,0.0,0.8,0.3]},{l:'PVRWE',sub:'TNFα',v:[0.0,0.3,0.1,0.8]}],
      bridge:'<strong>Minimising InfoNCE = maximising the Boltzmann probability that each antibody picks its true antigen.</strong> Done both ways it is the <strong>symmetric</strong> loss (next).' },
  };
  let exKey='clip', anchor=0, tau=0.25;

  function render(){
    const ex=EX[exKey], n=ex.rows.length;
    document.getElementById('recog').innerHTML=ex.recog;
    const Mx=ex.rows.map(r=>ex.cols.map(c=>cos(r.v,c.v)));
    const lab=it=>`${it.l}${it.sub?`<span class="sub">${it.sub}</span>`:''}`;

    // matrix
    const grid=document.getElementById('grid');
    grid.style.gridTemplateColumns=`${ex.rlw}px repeat(${n}, 50px)`;
    let h=`<div class="corner">${ex.corner}</div>`+ex.cols.map(c=>`<div class="ml">${lab(c)}</div>`).join('');
    for(let i=0;i<n;i++){
      h+=`<div class="ml seq ${i===anchor?'anchor':''}" data-i="${i}">${lab(ex.rows[i])}</div>`;
      for(let j=0;j<n;j++){ const v=Mx[i][j]; const cls=['cell']; if(i===j)cls.push('diag'); if(i===anchor)cls.push('arow');
        h+=`<div class="${cls.join(' ')}" data-i="${i}" style="cursor:pointer;background:${heat(v)};color:${v>0.5?'#fff':'var(--text)'}">${f2(v)}</div>`; }
    }
    grid.innerHTML=h;
    grid.querySelectorAll('.ml.seq, .cell').forEach(el=>el.addEventListener('click',()=>{anchor=+el.dataset.i;render();}));

    // anchor row → softmax(cos/τ)
    const row=Mx[anchor];
    const logits=row.map(c=>c/tau), m=Math.max(...logits), e=logits.map(x=>Math.exp(x-m)), Z=e.reduce((a,b)=>a+b,0), P=e.map(x=>x/Z);
    const pm=P[anchor], loss=-Math.log(pm);
    document.getElementById('ph').innerHTML=`anchor: <span style="color:var(--accent);font-weight:700">${ex.rows[anchor].l}</span> — which ${ex.tgt} does it bind?`;
    document.getElementById('rowcos').innerHTML=`cosines: ${ex.cols.map((c,j)=>`${c.l} <b style="color:var(--text)">${f2(row[j])}</b>`).join(' · ')}`;
    const pmax=Math.max(...P);
    document.getElementById('pbars').innerHTML=ex.cols.map((c,j)=>{
      const match=j===anchor;
      return `<div class="pbar"><div class="pt ${match?'match':''}">${c.l}${match?' ★':''}</div>`+
        `<div class="ptrack"><div class="pfill" style="width:${(P[j]*100).toFixed(0)}%;background:${heat(P[j]/pmax)}"></div></div>`+
        `<div class="pv">${(P[j]*100).toFixed(0)}%</div></div>`;
    }).join('');
    document.getElementById('lossbox').innerHTML=
      `P(match) = e<sup>${f2(row[anchor])}/${f2(tau)}</sup> / Z = <span class="res">${f2(pm)}</span><br>`+
      `loss = −log P(match) = <span class="res">${loss.toFixed(2)}</span> ${loss<0.3?'✓ low — correct & confident':loss>1?'⚠ high — confused':''}`;

    // metrics over all anchors
    let lT=0, hits=0, pS=0;
    for(let i=0;i<n;i++){ const lg=Mx[i].map(c=>c/tau), mm=Math.max(...lg), ee=lg.map(x=>Math.exp(x-mm)), ZZ=ee.reduce((a,b)=>a+b,0), PP=ee.map(x=>x/ZZ);
      lT+=-Math.log(PP[i]); pS+=PP[i]; if(PP.indexOf(Math.max(...PP))===i) hits++; }
    document.getElementById('lossT').textContent=(lT/n).toFixed(2);
    const r1=document.getElementById('r1'); r1.textContent=`${hits}/${n}`; r1.classList.toggle('good',hits===n);
    document.getElementById('pAvg').textContent=f2(pS/n);
    document.getElementById('tauv').textContent=f2(tau);
    document.getElementById('bridge').innerHTML=ex.bridge;
    if(window.MathJax&&window.MathJax.typesetPromise) window.MathJax.typesetPromise([document.getElementById('recog'),document.getElementById('bridge')]);
  }
  document.getElementById('tau').addEventListener('input',e=>{tau=parseFloat(e.target.value);render();});
  document.querySelectorAll('[data-ex]').forEach(b=>b.addEventListener('click',()=>{exKey=b.dataset.ex;anchor=0;document.querySelectorAll('[data-ex]').forEach(x=>x.classList.toggle('on',x.dataset.ex===exKey));render();}));
  render();

  if (window.parent && window.parent !== window) {
    document.addEventListener('keydown', (e) => {
      if (['INPUT','TEXTAREA','SELECT','BUTTON'].includes(e.target.tagName)) return;
      const nx=['ArrowRight','PageDown'], pv=['ArrowLeft','PageUp'];
      if (nx.includes(e.key)){ e.preventDefault(); window.parent.postMessage({type:'mrc-deck-advance',direction:'next'},'*'); }
      else if (pv.includes(e.key)){ e.preventDefault(); window.parent.postMessage({type:'mrc-deck-advance',direction:'prev'},'*'); }
    });
  }
</script>

</body>
</html>
