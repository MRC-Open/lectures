<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MRC L3 — From Matrix to One Vector</title>
<script>
  MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }, svg: { fontCache: 'global' } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
<link rel="stylesheet" href="../../mrc_styles.css">
<style>
  .recog { text-align: center; font-family: var(--font-sans); font-size: 13px; line-height: 1.6; margin: 2px auto 10px; max-width: 820px; color: var(--text); background: var(--accent-faint); border-radius: 6px; padding: 8px 14px; }
  .recog b { color: var(--accent); }
  .toggles { display: flex; gap: 20px; justify-content: center; flex-wrap:wrap; margin: 2px 0 10px 0; }
  .tg { display:flex; gap:6px; align-items:center; }
  .tg .gl { font-family: var(--font-sans); font-size:10px; letter-spacing:0.6px; text-transform:uppercase; color: var(--text-muted); font-weight:600; }
  .tbtn { font-family: var(--font-sans); font-size: 12.5px; padding: 6px 13px; border: 1px solid var(--rule); background: white; color: var(--text-muted); border-radius: 4px; cursor: pointer; }
  .tbtn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-faint); font-weight: 600; }

  .flow { display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; margin: 2px 0; }
  .inp { display:flex; flex-direction:column; align-items:center; gap:3px; }
  .inp .big { font-size:26px; } .inp .cap { font-family: var(--font-serif); font-size:13px; color: var(--text); } .inp .sub { font-family: var(--font-sans); font-size:10px; color: var(--text-muted); }
  .enc { font-family: var(--font-sans); font-size:10px; color: var(--accent); border:1.5px solid var(--accent); border-radius:5px; padding:6px 9px; text-align:center; background: var(--accent-faint); }
  .op { font-family: var(--font-sans); font-size:11px; color: var(--text-muted); text-align:center; } .op b { color: var(--accent); display:block; font-size:12px; }

  .matblock { display:flex; align-items:center; gap:6px; }
  .daxis { writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--font-sans); font-size:10px; color: var(--accent); font-weight:600; text-align:center; }
  .grid { display:inline-grid; gap:2px; }
  .ml { font-family: var(--font-serif); font-size:11px; color: var(--text-muted); display:flex; align-items:center; justify-content:center; }
  .ml.tok { font-size:14px; color: var(--text); font-weight:600; }
  .ml.dim { font-family: var(--font-sans); font-size:10px; }
  .mc { width:42px; height:23px; border-radius:2px; display:flex; align-items:center; justify-content:center; font-family: var(--font-serif); font-size:11px; color: var(--text); font-variant-numeric:tabular-nums; }
  .wcol { height:30px; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:1px; }
  .wbar { width:18px; background: var(--accent); border-radius:2px 2px 0 0; min-height:2px; }
  .wcol span { font-family: var(--font-sans); font-size:9px; color: var(--text-muted); }
  .wlab { font-family: var(--font-sans); font-size:9px; color: var(--accent); }

  .fp { display:inline-grid; gap:2px; }
  .fp .mc { border:2px solid var(--accent); }

  .dnote { border:1px solid var(--rule); background: var(--accent-faint); border-radius:8px; padding:7px 14px; max-width:800px; margin:10px auto 0; font-family: var(--font-sans); font-size:12px; line-height:1.5; text-align:center; color: var(--text); }
  .dnote b { color: var(--accent); }
  .dnote .big { font-family: var(--font-serif); font-size:15px; font-weight:700; color: var(--accent); }
  .work { display:flex; flex-direction:row; flex-wrap:wrap; gap:9px; margin:11px auto 0; max-width:860px; font-family: var(--font-serif); font-size:12.5px; font-variant-numeric:tabular-nums; text-align:left; align-items:stretch; }
  .work .mut { color: var(--text-muted); } .work .res { color: var(--accent); font-weight:700; }
  .wk { flex:1 1 380px; border:1px solid var(--rule); border-left:3px solid var(--accent); border-radius:6px; padding:8px 13px; background:#fbfaff; }
  .wk .wh { font-family: var(--font-sans); font-size:10px; letter-spacing:0.5px; text-transform:uppercase; color: var(--accent); font-weight:700; margin-bottom:5px; }
  .wk .wl { line-height:1.7; } .wk b { font-weight:700; } .wk .mut { color: var(--text-muted); }
  .note { text-align:center; font-family: var(--font-sans); font-size:12px; color: var(--text); margin:8px auto 0; max-width:740px; line-height:1.55; }
  .note b { color: var(--accent); } .note .hd { font-weight:700; color: var(--accent); }

  .clsbox { max-width:860px; margin:9px auto 0; border:1.5px solid var(--accent); background: var(--accent-faint); border-radius:8px; padding:9px 18px; font-family: var(--font-sans); font-size:12.5px; line-height:1.48; color: var(--text); }
  .clsbox:empty { display:none; }
  .clsbox .ch { font-size:11px; letter-spacing:0.5px; text-transform:uppercase; color: var(--accent); font-weight:700; margin-bottom:6px; }
  .clsbox b { color: var(--accent); }
  .clsbox .li { margin:4px 0 4px 15px; position:relative; }
  .clsbox .li:before { content:"›"; position:absolute; left:-13px; color: var(--accent); font-weight:700; }
  .clsbox .anal { margin-top:6px; padding-top:6px; border-top:1px dashed var(--rule); font-style:italic; color: var(--text-muted); }

  .bridge { border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 12px; font-size: 15px; line-height: 1.7; color: var(--text); text-align: center; }
  .bridge strong { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>

<div class="stage wide">
  <h1>From the Embedding Matrix to One Vector</h1>
  <div class="subtitle">MRC LECTURE 3 · INTUITION · ONE COLUMN PER TOKEN · d DIMENSIONS DEEP</div>

  <div class="recog" id="recog"></div>
  <div class="toggles">
    <div class="tg"><span class="gl">example</span><button class="tbtn on" data-ex="clip">CLIP · image</button><button class="tbtn" data-ex="calm">SFM · antibody</button></div>
    <div class="tg"><span class="gl">pooling</span><button class="tbtn on" data-m="mean">mean-pool</button><button class="tbtn" data-m="attn">attention-pool</button></div>
  </div>

  <div class="flow">
    <div class="inp" id="inp"></div>
    <div class="op">→<div class="enc" id="enc"></div></div>
    <div class="matblock">
      <div class="daxis" id="daxis"></div>
      <div>
        <div class="op" style="margin-bottom:3px;">embedding matrix — <span style="color:var(--accent)">each token is a column</span></div>
        <div class="grid" id="mat"></div>
      </div>
    </div>
    <div class="op" id="poolop"></div>
    <div>
      <div class="op" style="margin-bottom:3px;color:var(--accent);font-weight:700;">fingerprint z</div>
      <div class="fp" id="fp"></div>
    </div>
  </div>

  <div class="dnote" id="dnote"></div>
  <div class="work" id="work"></div>
  <div class="clsbox" id="clsbox"></div>
  <div class="note" id="note"></div>
  <div class="bridge" id="bridge"></div>
</div>

<script>
  function heat(t){ t=Math.max(0,Math.min(1,t)); let r,g,b;
    if(t<0.5){const u=t/0.5; r=43+(238-43)*u; g=108+(238-108)*u; b=176+(238-176)*u;}
    else{const u=(t-0.5)/0.5; r=238+(200-238)*u; g=238+(54-238)*u; b=238+(54-238)*u;}
    return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`; }
  const f2=n=>n.toFixed(2);

  // M[token][dim] — 4 tokens, 4 dims; column means = [0.90,0.20,0.10,0.10]
  const M=[[0.95,0.10,0.20,0.00],[0.85,0.30,0.00,0.20],[0.92,0.15,0.15,0.10],[0.88,0.25,0.05,0.10]];
  const softmax=a=>{const m=Math.max(...a),e=a.map(x=>Math.exp(x-m)),Z=e.reduce((p,c)=>p+c,0);return e.map(x=>x/Z);};
  const S_ATTN=[2.0,0.4,1.5,0.4]; // raw scores: the learned query q dotted with each token column
  const W={ mean:[0.25,0.25,0.25,0.25], attn:softmax(S_ATTN) };
  const poolWith=w=>[0,1,2,3].map(d=>M.reduce((s,row,t)=>s+w[t]*row[d],0));

  const EX = {
    clip: { recog:'An encoder outputs a <b>matrix</b> — <b>one column per token</b> (image patch), each column a vector of <b>d numbers</b> (the rows). To <b>score</b> two things we collapse all the columns into one <b>fingerprint</b>. The question is <b>how much each column counts</b>.',
      big:'🐕', cap:'a photo of a dog', sub:'→ 4 patches', enc:'image encoder<br>ViT', toks:['p₁','p₂','p₃','p₄'], focus:'the salient patches',
      realD:'512', realModel:'CLIP (ViT-B)' },
    calm: { recog:'AntiBERTy outputs a <b>matrix</b> — <b>one column per residue</b> of the antibody, each column a vector of <b>d numbers</b> (the rows). To score binding we collapse the columns into one antibody <b>fingerprint</b>. The question is <b>how much each residue counts</b>.',
      big:'🧬', cap:'CDR-H3', sub:'→ residues', enc:'AntiBERTy', toks:['C','A','R','V'], focus:'the binding residues',
      realD:'1,280', realModel:'ESM-2' }
  };
  const METH = {
    mean:{ op:'<b>mean-pool</b>↓<br>equal<br>columns', desc:`<span class="hd">Mean-pool.</span> Every column gets the <b>same</b> weight ($1/N$) — simplest, no parameters, but it <b>dilutes</b> the few tokens that carry the signal.` },
    attn:{ op:'<b>weighted</b>↓<br>Σ wᵢ·colᵢ', desc:`<span class="hd">Attention-pool / [CLS].</span> A <b>learned</b> weight per column, so the model <b>concentrates</b> on the columns that matter. The <b>[CLS]</b> token is the trained version of this.` }
  };
  let exKey='clip', meth='mean';

  function render(){
    const ex=EX[exKey], me=METH[meth], w=W[meth], wmax=Math.max(...w), nT=ex.toks.length, nD=4;
    document.getElementById('recog').innerHTML=ex.recog;
    document.getElementById('inp').innerHTML=`<div class="big">${ex.big}</div><div class="cap">${ex.cap}</div><div class="sub">${ex.sub}</div>`;
    document.getElementById('enc').innerHTML=ex.enc;
    document.getElementById('daxis').innerHTML=`d dimensions ↓ &nbsp;(${ex.realD} real)`;
    document.getElementById('poolop').innerHTML=me.op;

    // matrix: header = tokens (columns); rows = dims; last row = weights
    const grid=document.getElementById('mat');
    grid.style.gridTemplateColumns=`30px repeat(${nT}, 42px)`;
    let h=`<div class="ml"></div>`+ex.toks.map(t=>`<div class="ml tok">${t}</div>`).join('');
    for(let d=0; d<nD; d++){ h+=`<div class="ml dim">d${d+1}</div>`+ex.toks.map((t,ti)=>{const v=M[ti][d]; return `<div class="mc" style="background:${heat(v)};color:${v>0.55?'#fff':'var(--text)'}">${f2(v)}</div>`;}).join(''); }
    h+=`<div class="ml wlab">wᵢ</div>`+ex.toks.map((t,ti)=>`<div class="wcol"><div class="wbar" style="height:${(w[ti]/wmax*26).toFixed(0)}px"></div><span>${(w[ti]*100).toFixed(0)}</span></div>`).join('');
    grid.innerHTML=h;

    // fingerprint column
    const z=poolWith(w);
    let p='';
    for(let d=0; d<nD; d++) p+=`<div class="ml dim">d${d+1}</div>`+`<div class="mc" style="background:${heat(z[d])};color:${z[d]>0.55?'#fff':'var(--text)'}">${f2(z[d])}</div>`;
    document.getElementById('fp').style.gridTemplateColumns=`30px 42px`;
    document.getElementById('fp').innerHTML=p;

    document.getElementById('dnote').innerHTML=
      `<b>What is d?</b> We draw <span class="big">4</span> rows to read it — a real fingerprint has <span class="big">${ex.realD}</span> (${ex.realModel}). Each row is a <b>learned axis</b>; the numbers place the molecule on the <b>energy landscape</b> (slide 26). “High-dimensional” = a very long column.`;
    const poolBox=`<div class="wk"><div class="wh">then pool — z = Σ wᵢ · columnᵢ, one row (dimension) at a time</div>`+
      [0,1,2,3].map(d=>`<div class="wl">z<sub>${d+1}</sub> = ${M.map((row,t)=>`(${f2(w[t])})(${f2(row[d])})`).join(' + ')} = <span class="res">${f2(z[d])}</span></div>`).join('')+`</div>`;
    let provBox;
    if(meth==='attn'){
      const e=S_ATTN.map(Math.exp), Z=e.reduce((a,b)=>a+b,0);
      provBox=`<div class="wk"><div class="wh">where the weights come from — attention-pool</div>`+
        `<div class="wl"><b>①</b> a <b>learned query q</b> scores each column (q·k, slide 14): &nbsp; sᵢ = q·colᵢ = [${S_ATTN.map(f2).join(',  ')}]</div>`+
        `<div class="wl"><b>②</b> <b>softmax</b> the scores (Boltzmann again): &nbsp; wᵢ = e<sup>sᵢ</sup> ⁄ Σⱼ e<sup>sⱼ</sup></div>`+
        `<div class="wl">&nbsp;&nbsp;&nbsp;e<sup>s</sup> = [${e.map(f2).join(',  ')}], &nbsp; Σ = ${f2(Z)} &nbsp;→&nbsp; w = [${w.map(f2).join(',  ')}]</div></div>`;
    } else {
      provBox=`<div class="wk"><div class="wh">where the weights come from — mean-pool</div>`+
        `<div class="wl">no query, no scores — every column counts equally: &nbsp; wᵢ = 1⁄N = 1⁄4 = <b>0.25</b></div>`+
        `<div class="wl mut">zero parameters, but the few columns carrying ${ex.focus} get <b>diluted</b> by the rest</div></div>`;
    }
    document.getElementById('work').innerHTML=provBox+poolBox;
    document.getElementById('clsbox').innerHTML = meth==='attn' ?
      `<div class="ch">what is [CLS]? — nobody types in those weights; the model learns them</div>`+
      `<div class="li">the query <b>q</b> starts as <b>random numbers</b> — the weights above are not set by hand</div>`+
      `<div class="li">during training, every true binder is pushed toward <b>cosine = 1</b>; that signal flows backward and <b>reshapes q</b> to score the binding-relevant columns highest — the weights are <b>discovered from data</b>, like the encoder’s own</div>`+
      `<div class="li">in a real model this q lives as a special token, <b>[CLS]</b>, added to the front of the sequence — it is <b>not a residue</b>, it’s an empty “summary slot” that reads every column and <b>becomes the fingerprint z</b></div>`+
      `<div class="anal">Like a <b style="color:inherit">rapporteur</b> at a meeting: a person who isn’t a delegate, but listens to everyone and writes the one-paragraph summary — and over many meetings has learned whose input matters most.</div>`
      : '';
    document.getElementById('note').innerHTML='';

    const mp=poolWith(W.mean);
    document.getElementById('bridge').innerHTML=
      `One <strong>fingerprint vector</strong> per molecule — ${ex.realD} numbers (4 shown). ${meth==='mean'?`This mean-pool z <strong>[${mp.map(f2).join(', ')}]</strong> is the vector on the next slide`:`(the next slide uses the mean-pool z <strong>[${mp.map(f2).join(', ')}]</strong>)`}. The partner pools the same way; then we score the two with <strong>cosine</strong>.`;
    if(window.MathJax&&window.MathJax.typesetPromise) window.MathJax.typesetPromise([document.getElementById('recog'),document.getElementById('note'),document.getElementById('bridge')]);
  }
  document.querySelectorAll('[data-ex]').forEach(b=>b.addEventListener('click',()=>{exKey=b.dataset.ex;document.querySelectorAll('[data-ex]').forEach(x=>x.classList.toggle('on',x.dataset.ex===exKey));render();}));
  document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{meth=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x.dataset.m===meth));render();}));
  render();

  if (window.parent && window.parent !== window) {
    document.addEventListener('keydown', (e) => {
      if (['INPUT','TEXTAREA','SELECT','BUTTON'].includes(e.target.tagName)) return;
      const nx=['ArrowRight','PageDown'], pv=['ArrowLeft','PageUp'];
      if (nx.includes(e.key)){ e.preventDefault(); window.parent.postMessage({type:'mrc-deck-advance',direction:'next'},'*'); }
      else if (pv.includes(e.key)){ e.preventDefault(); window.parent.postMessage({type:'mrc-deck-advance',direction:'prev'},'*'); }
    });
  }
</script>

</body>
</html>
